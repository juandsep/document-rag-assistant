[project]
name = "rag"
version = "0.1.0"
description = "Document RAG assistant: vector retrieval over a business corpus with a traced retrieval chain."
readme = "README.md"
authors = [
    { name = "jd", email = "juandsep@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.108",
    "fastapi>=0.142.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Local `uv sync` installs everything; the image installs none of these groups
# (docker/Dockerfile), so it ships without Streamlit, MLflow or the PDF/DOCX
# parsers, which only run when indexing.
default-groups = ["dev", "ui", "eval", "ingest"]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.6.0",
]
eval = [
    "mlflow>=3.16.1",
]
ingest = [
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "qdrant-client>=1.19.1",
]
ui = [
    "streamlit>=1.65.0",
]

[tool.ruff]
line-length = 88

[tool.coverage.run]
source = ["src"]
# The Streamlit UI is a script, not an importable module: it is exercised
# manually, so measuring it here would only add noise.
omit = ["src/rag/ui.py"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
]
