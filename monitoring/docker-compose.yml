# Local Grafana over CloudWatch (adapted from telegram-personal-assistant's
# monitoring/). It only reads: metrics and alarms live in CloudWatch
# (infra/monitoring.tf) and keep working when this is stopped.
# Start: AWS_PROFILE=<profile> docker compose -f monitoring/docker-compose.yml up -d,
# then open http://localhost:3000.

services:
  grafana:
    image: grafana/grafana:12.2.0
    environment:
      # Local only: open without a login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # The datasource uses the AWS SDK default chain. Grafana's SDK cannot read
      # an `sso-session` profile, so pass the session's temporary credentials:
      #   eval "$(aws configure export-credentials --profile rag --format env)"
      # A classic profile in the mounted ~/.aws works too (AWS_PROFILE).
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_SDK_LOAD_CONFIG: "1"
      HOME: /etc/aws-home
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${HOME}/.aws:/etc/aws-home/.aws:ro
    ports:
      - "127.0.0.1:3000:3000"
