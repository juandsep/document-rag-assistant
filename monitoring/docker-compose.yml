# Local Grafana over CloudWatch (adapted from telegram-personal-assistant's
# monitoring/). It only reads: metrics and alarms live in CloudWatch
# (infra/monitoring.tf) and keep working when this is stopped.
# Start: AWS_PROFILE=<profile> docker compose -f monitoring/docker-compose.yml up -d,
# then open http://localhost:3000.

services:
  grafana:
    image: grafana/grafana:12.2.0
    environment:
      # Local only: open without a login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # The datasource uses the AWS SDK default chain: this profile, read from
      # the mounted ~/.aws (SSO token cache included). No key is copied here.
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_SDK_LOAD_CONFIG: "1"
      HOME: /etc/aws-home
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${HOME}/.aws:/etc/aws-home/.aws:ro
    ports:
      - "127.0.0.1:3000:3000"
